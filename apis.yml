aid: rodeo
name: Rodeo
description: 'Rodeo is a consumer social app that helps people wrangle their social
  life: save the things you want to do — social posts, screenshots, links and photos
  — and then do the things you saved together with friends, while Rodeo wrangles the
  details and keeps you organized. Tagline: "Save it. Do it." Backed by Foundry Group
  and Seedcamp. As of this enrichment pass Rodeo publishes no public API, developer
  portal, documentation, SDKs or .well-known discovery surface — it is a consumer
  mobile/web product, not an API provider.'
